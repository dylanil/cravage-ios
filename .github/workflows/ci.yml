# Builds and tests on every push, on GitHub's free macOS runners (free and uncapped for public repos).
# Two jobs: the pure-Swift CravageCore package (fast, no simulator), and the iOS app on a simulator
# (skipped until Cravage.xcodeproj exists). No code signing and no TestFlight upload happen here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: CravageCore tests + Python transcript acceptance
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Run CravageCore tests
        run: swift test --package-path CravageCore
        env:
          CRAVAGE_TRANSCRIPT_OUT: ${{ runner.temp }}/golden.json
      - name: Verify the Swift-produced transcript with the Python v2 check
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          PATH="$RUNNER_TEMP/venv/bin:$PATH" Tools/transcript_acceptance.sh "$RUNNER_TEMP/golden.json"
      - name: Check the vendored verifier still matches upstream SMPC
        run: Tools/check_verifier_sync.sh
      - name: Public-safety lint (no owner-personal material in tracked files)
        run: Tools/check_public_safe.sh

  mutations:
    name: Mutation gate (every listed guard is caught by a test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
      - name: Break each guard in Tools/mutations.json and require a failing test
        run: |
          python3 -m unittest discover -s Tools -p test_check_mutations.py
          python3 Tools/check_mutations.py
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-evidence
          path: .build/mutations/

  app:
    name: iOS app build + tests (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
      - name: Build and test on a simulator
        run: |
          if [ ! -d Cravage.xcodeproj ]; then
            echo "No Xcode project yet - skipping app job"
            exit 0
          fi
          SIM="$(xcrun simctl list devices available | grep -m1 -o 'iPhone [0-9A-Za-z ]*' | sed 's/ *$//')"
          echo "Simulator: $SIM"
          xcodebuild test \
            -project Cravage.xcodeproj \
            -scheme Cravage \
            -destination "platform=iOS Simulator,name=$SIM" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath "$RUNNER_TEMP/result.xcresult"
          python3 Tools/check_mutations.py --suite app \
            --destination "platform=iOS Simulator,name=$SIM"
      - name: Build the Release configuration (no test hooks, no signing)
        run: |
          if [ ! -d Cravage.xcodeproj ]; then exit 0; fi
          xcodebuild build \
            -project Cravage.xcodeproj \
            -scheme Cravage \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Upload the test result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/result.xcresult
      - name: Upload app mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-mutation-evidence
          path: .build/mutations/
